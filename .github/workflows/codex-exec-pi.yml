name: codex-exec-pi
on:
  push:
    paths:
      - 'packages/codex-exec-pi/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/codex-exec-pi.yml'
  pull_request:
    paths:
      - 'packages/codex-exec-pi/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/codex-exec-pi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check --workspace codex-exec-pi
      - run: npm pack --dry-run
        working-directory: packages/codex-exec-pi
